server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # Aset build dengan hash pada nama file boleh dicache agresif
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # File PWA tidak boleh dicache agar pembaruan service worker terdeteksi
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }

    # Proxy API ke backend container (nilai diisi dari env BACKEND_URL, lihat Dockerfile)
    location /api/ {
        proxy_pass $BACKEND_URL;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 25m;
    }

    # Foto/gambar yang disajikan backend (upload pengaduan, logo, dsb.)
    location /uploads/ {
        proxy_pass $BACKEND_URL;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=604800";
    }

    # SPA fallback: semua rute react-router diarahkan ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
